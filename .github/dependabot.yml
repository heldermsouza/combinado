version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
      efcore:
        patterns: ["Npgsql.*", "EFCore.*"]
      serilog:
        patterns: ["Serilog*"]
      rebus:
        patterns: ["Rebus*"]
      testing:
        patterns: ["xunit*", "Testcontainers.*", "Respawn"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /src/web
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      next:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react*"]
      tanstack:
        patterns: ["@tanstack/*"]
      tooling:
        patterns: ["eslint*", "typescript", "tailwindcss", "@tailwindcss/*"]
    ignore:
      # Majors travados enquanto o ecossistema não acompanha (verificado 2026-09-29):
      # - eslint 10 quebra o carregamento do eslint-config-next 16.3
      # - typescript 7 não é aceito pelo typescript-eslint 8.x (peer < 6.1)
      # - @types/node segue a major do runtime (Node 24), não a última publicada
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    commit-message:
      prefix: "chore(ci)"
