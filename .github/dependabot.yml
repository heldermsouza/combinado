version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
      efcore:
        patterns: ["Npgsql.*", "EFCore.*"]
      serilog:
        patterns: ["Serilog*"]
      rebus:
        patterns: ["Rebus*"]
      testing:
        patterns: ["xunit*", "Testcontainers.*", "Respawn"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /src/web
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      next:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react*"]
      tanstack:
        patterns: ["@tanstack/*"]
      tooling:
        patterns: ["eslint*", "typescript", "tailwindcss", "@tailwindcss/*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    commit-message:
      prefix: "chore(ci)"
